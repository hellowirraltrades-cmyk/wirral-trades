<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tradesman Sign Up</title>
</head>
<body>

<h1>Tradesman Sign Up</h1>

<form id="signup-form">
  <input type="text" id="name" placeholder="Business Name" required><br><br>
  <input type="email" id="email" placeholder="Email" required><br><br>
  <input type="text" id="trade" placeholder="Trade" required><br><br>
  <input type="text" id="area" placeholder="Area" required><br><br>

  <button type="submit">Sign Up</button>
</form>

<p id="message"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
  const supabase = window.supabase.createClient(
    "https://albxdmnscsekjoirjoee.supabase.co",
    "sb_publishable_gK_FzHhpv79eSJp8NhZ-7A_zMWJ2Wh1"
  );

  document.getElementById("signup-form").addEventListener("submit", async function(e) {
    e.preventDefault(); // 🚨 THIS STOPS PAGE JUMP

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const trade = document.getElementById("trade").value;
    const area = document.getElementById("area").value;

    const { error } = await supabase
      .from("tradespeople")
      .insert([{
        business_name: name,
        email: email,
        trades: [trade],
        area: area
      }]);

    if (error) {
      document.getElementById("message").innerText = "❌ Error";
      console.log(error);
    } else {
      document.getElementById("message").innerText = "✅ Success";
      document.getElementById("signup-form").reset();
    }
  });
</script>

</body>
</html>
