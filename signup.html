<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>
</head>
<body>

<h2>Register as a Tradesperson</h2>

<form id="signup-form">
  <input id="business_name" placeholder="Business Name" required><br><br>
  <input id="email" placeholder="Email" required><br><br>
  <input id="phone" placeholder="Phone"><br><br>
  <input id="trades" placeholder="Trades (comma separated)"><br><br>
  <input id="areas" placeholder="Areas (comma separated)"><br><br>
  <button type="submit">Submit</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_ANON_KEY"
);

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = {
    business_name: document.getElementById('business_name').value,
    email: document.getElementById('email').value,
    phone: document.getElementById('phone').value,
    trades: document.getElementById('trades').value.split(',').map(t => t.trim()),
    areas: document.getElementById('areas').value.split(',').map(a => a.trim()),
    accepts_work: true
  };

  const { error } = await supabase
    .from('tradespeople')
    .insert([data]);

  if (error) {
    alert(error.message);
  } else {
    alert('Success!');
  }
});
</script>

</body>
</html>
