<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tradesman Sign Up</title>
</head>
<body>

<h1>Tradesman Sign Up</h1>

<form id="signup-form">
  <input type="text" id="name" placeholder="Business Name" required><br><br>

  <input type="email" id="email" placeholder="Email" required><br><br>

  <input type="text" id="trade" placeholder="Trade (e.g. plumber)" required><br><br>

  <button type="submit">Sign Up</button>
</form>

<p id="message"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://albxdmnscsekjoirjoee.supabase.co",
  "sb_publishable_gK_FzHhpv79eSJp8NhZ-7A_zMWJ2Wh1"
);

document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const business_name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const trade = document.getElementById("trade").value;

  const { error } = await supabase
    .from("tradespeople")
    .insert([
      {
        business_name: business_name,
        email: email,
        phone: "Not set",
        trades: [trade]
      }
    ]);

  if (error) {
    console.error(error);
    document.getElementById("message").innerText = "Error signing up";
  } else {
    document.getElementById("message").innerText = "Signed up successfully!";
  }
});
</script>

</body>
</html>
