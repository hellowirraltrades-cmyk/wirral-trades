<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wirral Trades</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111821;
    }

    .logo {
      font-weight: 800;
      font-size: 20px;
    }

    .btn {
      background: #00c2a8;
      padding: 12px 18px;
      border-radius: 6px;
      text-decoration: none;
      color: #000;
      font-weight: 600;
      cursor: pointer;
    }

    .hero {
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .section {
      padding: 40px 20px;
      text-align: center;
    }

    form {
      max-width: 500px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input, textarea {
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">WT Wirral Trades</div>
  <a class="btn" href="#post-job">Post a job</a>
</header>

<section class="hero">
  <h1>Find trusted local trades</h1>
  <p>Post your job and get matched with local professionals</p>
  <a class="btn" href="#post-job">Post a job</a>
</section>

<section class="section" id="post-job">
  <h2>Post your job</h2>

  <form id="jobForm">
    <input placeholder="Your name" required>
    <input placeholder="Phone" required>
    <input placeholder="Email" type="email" required>
    <textarea placeholder="Describe the job" required></textarea>

    <button class="btn" type="submit">Submit</button>
  </form>

  <p id="message"></p>
</section>

<script>
document.getElementById("jobForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("message").innerText = "Job submitted (we'll wire this up next 🔧)";
});
</script>

</body>
</html>
