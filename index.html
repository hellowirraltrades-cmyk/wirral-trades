<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wirral Trades</title>

  <!-- Leaflet map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
    }

    #map {
      height: 400px;
      margin-top: 20px;
    }

    form {
      margin-top: 20px;
    }

    input {
      padding: 8px;
      width: 250px;
      margin: 5px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Wirral Trades</h1>

<!-- FORM -->
<form id="signup-form">
  <input type="text" id="trade" placeholder="Trade (plumber, builder)" required><br>
  <input type="text" id="postcode" placeholder="Postcode" required><br>
  <input type="text" id="area" placeholder="Areas covered"><br>
  <input type="text" id="website" placeholder="Website / Facebook"><br>
  <button type="submit">Register</button>
</form>

<p id="message"></p>

<!-- MAP -->
<div id="map"></div>

<script>
const supabase = window.supabase.createClient(
  "https://albxdmnscsekjoirjoee.supabase.co",
  "sb_publishable_gK_FzHhpv79eSJp8NhZ-7A_zMWJ2Wh1"
);

// MAP SETUP
const map = L.map('map').setView([53.3727, -3.0738], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
}).addTo(map);

// LOAD EXISTING TRADES
async function loadTrades() {
  const { data, error } = await supabase
    .from("tradespeople")
    .select("*");

  if (data) {
    data.forEach(trade => {
      if (trade.postcode) {
        // fake coords for now (you can upgrade later)
        const lat = 53.37 + Math.random() * 0.05;
        const lng = -3.07 + Math.random() * 0.05;

        L.marker([lat, lng])
          .addTo(map)
          .bindPopup(`
            <b>${trade.trades}</b><br>
            ${trade.area || ""}<br>
            <a href="${trade.website}" target="_blank">${trade.website}</a>
          `);
      }
    });
  }
}

loadTrades();

// FORM SUBMIT
document.getElementById("signup-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const trade = document.getElementById("trade").value;
  const postcode = document.getElementById("postcode").value;
  const area = document.getElementById("area").value;
  const website = document.getElementById("website").value;

  const { error } = await supabase
    .from("tradespeople")
    .insert([{
      trades: trade,
      postcode: postcode,
      area: area,
      website: website
    }]);

  if (error) {
    document.getElementById("message").innerText = "❌ Error saving";
    console.log(error);
  } else {
    document.getElementById("message").innerText = "✅ Registered!";
    document.getElementById("signup-form").reset();
    loadTrades();
  }
});
</script>

</body>
</html>
