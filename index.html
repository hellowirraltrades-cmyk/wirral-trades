<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FixFinder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* HEADER */
header {
  background: #111;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}

.btn {
  background: #ff6600;
  padding: 10px 15px;
  border-radius: 5px;
}

/* HERO */
.hero {
  background: url('https://images.unsplash.com/photo-1581578731548-c64695cc6952') center/cover;
  color: white;
  text-align: center;
  padding: 120px 20px;
}

.hero h1 {
  font-size: 40px;
}

.hero p {
  font-size: 18px;
}

.hero .buttons {
  margin-top: 20px;
}

.hero .buttons a {
  margin: 10px;
  padding: 12px 20px;
  border-radius: 5px;
  text-decoration: none;
}

.primary {
  background: #ff6600;
  color: white;
}

.secondary {
  background: #333;
  color: white;
}

/* TRADES */
.trades {
  padding: 50px 20px;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card img {
  width: 50px;
}

/* FORM */
.form-section {
  background: #f5f5f5;
  padding: 50px 20px;
  text-align: center;
}

form {
  max-width: 500px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

input, textarea, select {
  padding: 10px;
}

button {
  background: #ff6600;
  color: white;
  padding: 12px;
  border: none;
}
</style>
</head>

<body>

<header>
  <h2>FixFinder</h2>
  <nav>
    <a href="#">Trades</a>
    <a href="#">How it works</a>
    <a href="#">Join</a>
    <a class="btn" href="#">Post job</a>
  </nav>
</header>

<section class="hero">
  <h1>Find trusted local tradespeople</h1>
  <p>Post your job and get matched fast</p>

  <div class="buttons">
    <a class="primary" href="#">Post a job</a>
    <a class="secondary" href="#">Join as a trade</a>
  </div>
</section>

<section class="trades">
  <h2>Popular trades</h2>

  <div class="grid">
    <div class="card">
      <img src="https://img.icons8.com/ios-filled/50/hammer.png">
      <p>Joiners</p>
    </div>

    <div class="card">
      <img src="https://img.icons8.com/ios-filled/50/pipe.png">
      <p>Plumbers</p>
    </div>

    <div class="card">
      <img src="https://img.icons8.com/ios-filled/50/electrical.png">
      <p>Electricians</p>
    </div>

    <div class="card">
      <img src="https://img.icons8.com/ios-filled/50/paint.png">
      <p>Decorators</p>
    </div>
  </div>
</section>

<section class="form-section">
  <h2>Post a Job</h2>

  <form>
    <input placeholder="Name">
    <input placeholder="Phone">
    <input placeholder="Postcode">

    <select>
      <option>Select trade</option>
      <option>Joiner</option>
      <option>Plumber</option>
    </select>

    <textarea placeholder="Describe your job"></textarea>

    <button>Submit Job</button>
  </form>
</section>

</body>
</html>
