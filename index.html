<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wirral Trades - Register</title>
</head>
<body>

<h1>Register your trade</h1>

<form id="signup-form">
  <input type="text" id="trade" placeholder="Main trade" required><br><br>

  <input type="text" id="postcode" placeholder="Base postcode" required><br><br>

  <input type="text" id="area" placeholder="Areas covered" required><br><br>

  <input type="text" id="website" placeholder="Website or Facebook"><br><br>

  <button type="submit">Register my trade</button>
</form>

<p id="message"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://albxdmnscsekjoirjoee.supabase.co",
  "sb_publishable_gK_FzHhpv79eSJp8NhZ-7A_zMWJ2Wh1"
);

document.getElementById("signup-form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const trade = document.getElementById("trade").value;
  const postcode = document.getElementById("postcode").value;
  const area = document.getElementById("area").value;
  const website = document.getElementById("website").value;

  const { error } = await supabase
    .from("tradespeople")
    .insert([{
      trades: [trade],
      postcode: postcode,
      area: area,
      website: website
    }]);

  if (error) {
    document.getElementById("message").innerText = "❌ Error saving";
    console.log(error);
  } else {
    document.getElementById("message").innerText = "✅ Registered!";
    document.getElementById("signup-form").reset();
  }
});
</script>

</body>
</html>
