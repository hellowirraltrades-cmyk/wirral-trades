<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wirral Trades</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f5f5f5;
}

header {
  background:#0f172a;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1 {
  margin:0;
  font-size:20px;
}

nav a {
  color:white;
  margin-left:20px;
  text-decoration:none;
}

.hero {
  background:#1e293b;
  color:white;
  padding:60px 20px;
  text-align:center;
}

.button {
  display:inline-block;
  padding:12px 20px;
  margin:10px;
  background:#22c55e;
  color:white;
  text-decoration:none;
  border-radius:6px;
}

.secondary {
  background:#3b82f6;
}

section {
  padding:40px 20px;
  max-width:900px;
  margin:auto;
}

.form-card {
  background:white;
  padding:20px;
  border-radius:10px;
}

input, select, textarea {
  width:100%;
  padding:10px;
  margin:10px 0;
}

button {
  background:#22c55e;
  color:white;
  padding:12px;
  border:none;
  width:100%;
  border-radius:6px;
}

.trade-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
  gap:15px;
}

.trade-card {
  background:white;
  padding:15px;
  text-align:center;
  border-radius:10px;
}

.trade-card img {
  width:60px;
}
</style>
</head>

<body>

<header>
  <h1>Wirral Trades</h1>
  <nav>
    <a href="#trades">Trades</a>
    <a href="#post-job">Post a job</a>
    <a href="#join">Join as a trade</a>
  </nav>
</header>

<div class="hero">
  <h2>Find trusted local tradespeople on the Wirral</h2>
  <a class="button" href="#post-job">Post a job</a>
  <a class="button secondary" href="#join">Join as a trade</a>
</div>

<!-- TRADES -->
<section id="trades">
  <h2>Popular Trades</h2>

  <div class="trade-grid">
    <div class="trade-card">
      <img src="https://img.icons8.com/ios-filled/100/hammer.png">
      <p>Joiners</p>
    </div>

    <div class="trade-card">
      <img src="https://img.icons8.com/ios-filled/100/wrench.png">
      <p>Plumbers</p>
    </div>

    <div class="trade-card">
      <img src="https://img.icons8.com/ios-filled/100/flash.png">
      <p>Electricians</p>
    </div>

    <div class="trade-card">
      <img src="https://img.icons8.com/ios-filled/100/paint-roller.png">
      <p>Decorators</p>
    </div>
  </div>
</section>

<!-- POST JOB -->
<section id="post-job">
  <h2>Post a Job</h2>

  <form class="form-card">
    <input placeholder="Your Name" required>
    <input placeholder="Phone" required>
    <input placeholder="Email" required>
    <input placeholder="Postcode" required>

    <select required>
      <option value="">Select Trade</option>
      <option>Joiner</option>
      <option>Plumber</option>
      <option>Electrician</option>
    </select>

    <textarea placeholder="Describe the job"></textarea>

    <button>Submit Job</button>
  </form>
</section>

<!-- JOIN AS TRADE -->
<section id="join">
  <h2>Join as a Trade</h2>

  <form class="form-card">
    <input placeholder="Business Name" required>
    <input placeholder="Your Name" required>
    <input placeholder="Phone" required>
    <input placeholder="Email" required>
    <input placeholder="Postcode" required>

    <select required>
      <option value="">Your Trade</option>
      <option>Joiner</option>
      <option>Plumber</option>
      <option>Electrician</option>
    </select>

    <textarea placeholder="Tell us about your experience"></textarea>

    <button>Apply to Join</button>
  </form>
</section>

</body>
</html>
