<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wirral Trades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 30px 20px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      margin-top: 10px;
      font-size: 18px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .map {
      margin-top: 30px;
    }

    iframe {
      width: 90%;
      max-width: 800px;
      height: 400px;
      border: 0;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Wirral Trades</h1>
    <p>Find trusted local tradespeople fast</p>

    <a href="#" class="btn">Join as a Trade</a>
  </header>

  <div class="map">
    <h2>Our Area</h2>

    <iframe 
      src="https://www.google.com/maps?q=Wirral&output=embed">
    </iframe>

  </div>

</body>
</html>
