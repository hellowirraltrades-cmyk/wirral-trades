<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wirral Trades — Professional Corporate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="container nav">
    <a class="brand" href="#"><span class="mark">WT</span>Wirral Trades</a>
    <button class="menu-toggle">☰</button>
    <nav class="nav-links">
      <a href="#trades">Trades</a>
      <a href="#how">How it works</a>
      <a href="#join">Join as a trade</a>
      <a class="button" href="#post-job">Post a job</a>
    </nav>
  </div>
</header>

<main>

<section class="hero">
  <div class="container">
    <h1>Find the right local trade for your job</h1>
    <p>Post your job free and we’ll introduce it to local tradespeople.</p>
    <a class="button" href="#post-job">Post a job</a>
  </div>
</section>

<section id="post-job" class="section">
  <div class="container">
    <h2>Post a Job</h2>

    <form id="jobForm">
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="postcode" placeholder="Postcode" required>

      <select id="tradeSelect" required>
        <option value="">Select trade</option>
        <option>Plumber</option>
        <option>Electrician</option>
        <option>Joiner</option>
      </select>

      <textarea placeholder="Describe the job" required></textarea>

      <button type="submit">Submit Job</button>
      <p id="jobMessage"></p>
    </form>

  </div>
</section>

</main>

<footer>
  <p>© Wirral Trades</p>
</footer>

<script src="script.js"></script>

</body>
</html>
