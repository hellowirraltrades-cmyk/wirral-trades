<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wirral Trades</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

header {
    background: #0d6efd;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
}

.hero {
    background: url('https://images.unsplash.com/photo-1503387762-592deb58ef4e') center/cover;
    color: white;
    text-align: center;
    padding: 80px 20px;
}

.btn {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    border-radius: 5px;
}

.btn-primary {
    background: #ffc107;
}

.btn-secondary {
    background: #28a745;
    color: white;
}

.services {
    padding: 30px;
    text-align: center;
}

.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
}

.card {
    background: white;
    width: 250px;
    margin: 10px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
}

.map {
    padding: 30px;
    text-align: center;
}

iframe {
    width: 90%;
    height: 300px;
    border: 0;
}

form {
    max-width: 600px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

input, textarea, select {
    padding: 10px;
    font-size: 16px;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 15px;
}
</style>
</head>

<body>

<header>Wirral Trades</header>

<section class="hero">
<h1>Find Trusted Local Tradespeople</h1>
<p>No middlemen. Just real local work.</p>

<a href="#post-job"><button class="btn btn-primary">Post a Job</button></a>
<a href="#join-trade"><button class="btn btn-secondary">Join as a Trade</button></a>
</section>

<section class="services">
<h2>Popular Services</h2>

<div class="cards">

<div class="card">
<img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952">
<h3>Carpentry</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc">
<h3>Plumbing</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1509395176047-4a66953fd231">
<h3>Electrical</h3>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1597007030739-6d2e1b3b8c7d">
<h3>Painting</h3>
</div>

</div>
</section>

<section id="post-job" style="padding:40px; background:white;">
<h2 style="text-align:center;">Post a Job</h2>

<form action="https://formspree.io/f/YOUR-ID" method="POST">
<input name="name" placeholder="Your Name" required>
<input name="phone" placeholder="Phone" required>
<input name="email" type="email" placeholder="Email" required>
<input name="postcode" placeholder="Postcode" required>

<select name="trade" required>
<option value="">Select Trade</option>
<option>Joiner</option>
<option>Plumber</option>
<option>Electrician</option>
<option>Decorator</option>
</select>

<input name="title" placeholder="Job Title" required>
<textarea name="description" placeholder="Describe the job..." rows="5" required></textarea>

<button class="btn btn-primary">Submit Job</button>
</form>
</section>

<section id="join-trade" style="padding:40px;">
<h2 style="text-align:center;">Join as a Tradesperson</h2>

<form action="https://formspree.io/f/YOUR-ID" method="POST">
<input name="name" placeholder="Your Name" required>
<input name="business" placeholder="Business Name" required>
<input name="phone" placeholder="Phone" required>
<input name="email" type="email" placeholder="Email" required>
<input name="trade" placeholder="Your Trade" required>
<input name="postcode" placeholder="Postcode" required>

<textarea name="about" placeholder="Tell customers about your work..." rows="5"></textarea>

<button class="btn btn-secondary">Register</button>
</form>
</section>

<section class="map">
<h2>Local Trades Near You</h2>
<iframe src="https://www.google.com/maps?q=wirral&output=embed"></iframe>
</section>

<footer>© 2026 Wirral Trades</footer>

</body>
</html>
