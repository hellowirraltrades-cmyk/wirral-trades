<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Connect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #f7f7f7;
}

/* NAVBAR */
.navbar {
    background: #111;
    color: white;
    display: flex;
    justify-content: space-between;
    padding: 20px 40px;
    align-items: center;
}

.navbar h1 {
    margin: 0;
    font-size: 22px;
}

.nav-links a {
    color: white;
    margin-left: 20px;
    text-decoration: none;
}

.btn-orange {
    background: #ff6a00;
    padding: 10px 18px;
    border-radius: 6px;
    color: white;
    text-decoration: none;
}

/* HERO */
.hero {
    display: flex;
    justify-content: space-between;
    padding: 60px 40px;
    align-items: center;
}

.hero-text {
    max-width: 50%;
}

.hero-text h2 {
    font-size: 42px;
    margin-bottom: 10px;
}

.hero-text p {
    font-size: 18px;
    color: #555;
}

.hero-buttons {
    margin-top: 20px;
}

.hero-buttons a {
    margin-right: 10px;
}

/* FORM */
.form-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
}

.form-box input,
.form-box select,
.form-box textarea {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.form-box button {
    width: 100%;
    background: #ff6a00;
    border: none;
    padding: 12px;
    color: white;
    font-weight: bold;
    border-radius: 6px;
}

/* TRADES */
.trades {
    padding: 40px;
}

.trades h3 {
    margin-bottom: 20px;
}

.trade-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
}

.trade-card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0px 5px 15px rgba(0,0,0,0.08);
}

.trade-card img {
    width: 60px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
    <h1>Trade Connect</h1>
    <div class="nav-links">
        <a href="#">Trades</a>
        <a href="#">How it works</a>
        <a href="#">Join as a trade</a>
        <a href="#" class="btn-orange">Post a job</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <div class="hero-text">
        <h2>Find trusted local tradespeople</h2>
        <p>Post your job and get matched with reliable trades near you</p>

        <div class="hero-buttons">
            <a href="#" class="btn-orange">Post a job</a>
            <a href="#" style="background:#333;color:white;padding:10px 18px;border-radius:6px;text-decoration:none;">Join as a trade</a>
        </div>
    </div>

    <!-- FORM -->
    <div class="form-box">
        <h3>Tell us about your job</h3>
        <input type="text" placeholder="Name">
        <input type="text" placeholder="Phone">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Postcode">

        <select>
            <option>Choose a trade</option>
            <option>Plumber</option>
            <option>Electrician</option>
            <option>Joiner</option>
            <option>Roofer</option>
        </select>

        <textarea placeholder="Describe your job"></textarea>

        <button>Submit</button>
    </div>
</div>

<!-- TRADES -->
<div class="trades">
    <h3>Popular trades</h3>

    <div class="trade-grid">

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">
            <p>Joiners</p>
        </div>

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966487.png">
            <p>Plumbers</p>
        </div>

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/1046/1046875.png">
            <p>Electricians</p>
        </div>

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/1828/1828911.png">
            <p>Decorators</p>
        </div>

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050525.png">
            <p>Roofers</p>
        </div>

        <div class="trade-card">
            <img src="https://cdn-icons-png.flaticon.com/512/427/427735.png">
            <p>Landscapers</p>
        </div>

    </div>
</div>

</body>
</html>
